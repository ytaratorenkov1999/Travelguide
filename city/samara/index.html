<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-text="title"></title>
    <meta name="description" content="Путеводитель">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/style_dark.css">
    <script src="../../js/app.js"></script>
</head>
<body data-city="samara">
    <!-- Фиксированная панель управления -->
    <header class="headerPanel">

        <div class="language-switcher">
            <a href="index_ru.html" class="lang-link active" aria-label="Русский" data-lang="ru">РУ</a>
            <span class="lang-separator">|</span>
            <a href="index_en.html" class="lang-link" aria-label="English" data-lang="en">EN</a>
            <span class="lang-separator">|</span>
            <a href="index_zh.html" class="lang-link" aria-label="中文" data-lang="zh">中文</a>
        </div>


        <!-- Кнопка выхода -->
        <a href="../../index.html" class="exitButton" aria-label="Вернуться на главную">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M18 6 6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
            </svg>
        </a>
    </header>

 <!-- Главный баннер -->
    <section class="mainBanner">
        <div class="mainBanner__background" data-bg="banner"></div>
    </section>

    <!-- Вводная секция с описанием региона  -->
    <section class="intro">
        <div class="intro__container">
            <h1 class="intro__title" data-text="title"></h1>
            <p class="intro__subtitle" data-text="introSubtitle"></p>
            <p class="intro__text" data-text="introText"></p>
        </div>
    </section>

    <!-- Секция: Точки притяжения региона -->
    <section class="contentSection contentSection--gray">
        <div class="container">
            <h2 class="contentSection__title" data-text="attractionsTitle"></h2>
            <div class="carousel">
                <div class="carousel__wrapper">
                    <div class="carousel__track" data-category="attractions">
                        <!-- Карточки генерируются через JavaScript -->
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Секция: Выбраться на природу -->
    <section class="contentSection contentSection--white">
        <div class="container">
            <h2 class="contentSection__title" data-text="natureTitle"></h2>
            <div class="carousel">
                <div class="carousel__wrapper">
                    <div class="carousel__track" data-category="nature">
                        <!-- Карточки генерируются через JavaScript -->
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Секция: Культурный код -->
    <section class="contentSection contentSection--gray">
        <div class="container">
            <h2 class="contentSection__title" data-text="cultureTitle"></h2>
            <div class="carousel">
                <div class="carousel__wrapper">
                    <div class="carousel__track" data-category="culture">
                        <!-- Карточки генерируются через JavaScript -->
                    </div>
                </div>
            </div>
        </div>
    </section>



    <!-- Модальное окно -->
    <div class="modal" id="attractionModal">
        <div class="modal__overlay"></div>
        <div class="modal__container">
            <button class="modal__close" aria-label="Закрыть">
                <svg viewBox="0 0 24 24">
                    <path d="M18 6 6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
                </svg>
            </button>

            <div class="modal__content" id="modalContent"></div>
        </div>
    </div>

    <!-- Тексты: js/city_data.js, карточки и модальные окна: scripts/data.js -->
    <script src="../../js/city_data.js"></script>
    <script src="scripts/data.js"></script>


</body>
</html>
